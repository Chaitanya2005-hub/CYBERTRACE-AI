<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Trace AI — Landing Page Concept</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=space-grotesk@500,600,700&f[]=jetbrains-mono@400,500,600&display=swap');

  :root {
    --base: #05080d;
    --panel: #0c131e;
    --panel-alt: #101a29;
    --border: #1c2a3d;
    --text: #dce6f2;
    --muted: #7d90a8;
    --accent: #2dd4e0;
    --accent-dim: #1a8b93;
    --critical: #ff5673;
    --medium: #ffb238;
    --low: #35d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Satoshi', sans-serif;
    background: #020408;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Stage ─── */
  #stage {
    width: 100%;
    aspect-ratio: 16/9;
    max-height: calc(100vh - 80px);
    overflow: hidden;
    position: relative;
  }

  .section-frame {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* ─── Noise overlay ─── */
  .section-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }


  /* ═══════════════════════════════════════════════════
     SECTION 1: HERO — Giant Statement, bottom-left
     over atmospheric dark gradient
     ═══════════════════════════════════════════════════ */
  .s1 {
    background: var(--base);
    justify-content: flex-end;
    padding: 0 8% 10%;
  }

  .s1-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 30%, rgba(45,212,224,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 20% 60%, rgba(255,86,115,0.03) 0%, transparent 60%),
      linear-gradient(180deg, transparent 40%, var(--base) 100%);
  }

  .s1-overline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .s1-headline {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 5vw, 64px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.03em;
    max-width: 700px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .s1-headline em {
    font-style: normal;
    color: var(--accent);
  }

  .s1-sub {
    font-size: 16px;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.5;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .s1-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: var(--accent);
    color: var(--base);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: opacity 150ms ease-out;
  }
  .s1-cta:active { opacity: 0.85; }

  /* Second-read: oversized numeral */
  .s1-numeral {
    position: absolute;
    right: 8%;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(80px, 14vw, 200px);
    font-weight: 700;
    color: rgba(45,212,224,0.04);
    line-height: 1;
    letter-spacing: -0.04em;
    z-index: 0;
    user-select: none;
  }


  /* ═══════════════════════════════════════════════════
     SECTION 2: TRUST BAR — Stacked center, minimal
     ═══════════════════════════════════════════════════ */
  .s2 {
    background: var(--panel);
    align-items: center;
    text-align: center;
    padding: 0 8%;
  }

  .s2-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .s2-metrics {
    display: flex;
    gap: 48px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .s2-metric {
    text-align: center;
  }

  .s2-metric-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .s2-metric-value--accent { color: var(--accent); }
  .s2-metric-value--critical { color: var(--critical); }
  .s2-metric-value--medium { color: var(--medium); }

  .s2-metric-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
  }

  .s2-divider {
    width: 1px;
    height: 40px;
    background: var(--border);
    align-self: center;
  }


  /* ═══════════════════════════════════════════════════
     SECTION 3: FEATURES — Right-third caption + left
     two-thirds visual (inverted classic)
     ═══════════════════════════════════════════════════ */
  .s3 {
    background: var(--base);
    flex-direction: row;
    align-items: center;
    padding: 0;
  }

  .s3-visual {
    flex: 2;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .s3-visual-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 40% 50%, rgba(45,212,224,0.08) 0%, transparent 60%),
      var(--panel);
  }

  /* Mini graph visualization */
  .s3-graph {
    position: relative;
    z-index: 1;
    width: 70%;
    max-width: 400px;
  }

  .s3-graph svg { width: 100%; height: auto; }

  .s3-caption {
    flex: 1;
    padding: 0 6%;
    position: relative;
    z-index: 1;
  }

  .s3-overline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .s3-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 14px;
  }

  .s3-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 320px;
    margin-bottom: 20px;
  }

  .s3-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: gap 150ms ease-out;
  }
  .s3-link:hover { gap: 10px; }


  /* ═══════════════════════════════════════════════════
     SECTION 4: PRODUCT SHOWCASE — Centered low over
     full-bleed graph visualization
     ═══════════════════════════════════════════════════ */
  .s4 {
    background: var(--base);
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 0 8% 12%;
  }

  .s4-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .s4-bg svg {
    width: 80%;
    max-width: 700px;
    opacity: 0.35;
  }

  .s4-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 20%, var(--base) 85%);
  }

  .s4-content {
    position: relative;
    z-index: 1;
  }

  .s4-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(24px, 3.5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .s4-desc {
    font-size: 14px;
    color: var(--muted);
    max-width: 500px;
    margin: 0 auto 24px;
    line-height: 1.5;
  }

  .s4-btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .s4-btn {
    padding: 10px 24px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 150ms ease-out;
  }
  .s4-btn:active { opacity: 0.85; }
  .s4-btn--primary { background: var(--accent); color: var(--base); border: none; }
  .s4-btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }


  /* ═══════════════════════════════════════════════════
     SECTION 5: TESTIMONIALS — Off-grid editorial,
     split quote wall
     ═══════════════════════════════════════════════════ */
  .s5 {
    background: var(--panel);
    flex-direction: row;
    padding: 0;
  }

  .s5-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 5% 0 8%;
  }

  .s5-overline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .s5-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(24px, 3vw, 38px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .s5-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 0 8% 0 4%;
  }

  .s5-quote {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    position: relative;
  }

  .s5-quote::before {
    content: '"';
    font-family: 'Space Grotesk', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    opacity: 0.3;
    position: absolute;
    top: 8px;
    left: 14px;
    line-height: 1;
  }

  .s5-quote-text {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    padding-left: 16px;
    margin-bottom: 10px;
  }

  .s5-quote-author {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 16px;
  }

  .s5-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .s5-avatar--1 { background: rgba(45,212,224,0.12); color: var(--accent); }
  .s5-avatar--2 { background: rgba(255,86,115,0.12); color: var(--critical); }

  .s5-author-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
  }
  .s5-author-role {
    font-size: 10px;
    color: var(--muted);
  }


  /* ═══════════════════════════════════════════════════
     SECTION 6: CTA — Mini minimalist, stacked center
     ═══════════════════════════════════════════════════ */
  .s6 {
    background: var(--base);
    align-items: center;
    text-align: center;
    padding: 0 8%;
  }

  .s6-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(26px, 4vw, 48px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
  }

  .s6-sub {
    font-size: 14px;
    color: var(--muted);
    max-width: 400px;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .s6-cta {
    padding: 14px 36px;
    background: var(--accent);
    color: var(--base);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 150ms ease-out;
  }
  .s6-cta:active { opacity: 0.85; }

  .s6-badge {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }


  /* ═══════════════════════════════════════════════════
     PICKER — Verbatim from PICKER.md
     ═══════════════════════════════════════════════════ */
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24), 0 2px 6px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
    white-space: nowrap;
  }
  .proto-picker-item:hover { color: rgba(255,255,255,0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,0.12); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Hero</button>
  <button class="proto-picker-item">Trust</button>
  <button class="proto-picker-item">Features</button>
  <button class="proto-picker-item">Product</button>
  <button class="proto-picker-item">Proof</button>
  <button class="proto-picker-item">CTA</button>
</nav>

<script>
const SECTIONS = [
  // ─── Section 1: Hero — Giant Statement, bottom-left ───
  () => `
    <div class="section-frame s1">
      <div class="s1-bg"></div>
      <div class="s1-numeral">247</div>
      <div class="s1-overline">SIH 26189 — Ministry of Home Affairs</div>
      <h1 class="s1-headline">Turn raw call records<br>into <em>traceable</em> criminal networks</h1>
      <p class="s1-sub">Upload CDR and bank transaction CSVs. The system builds an interactive link-graph, flags orchestrators, detects laundering rings — in seconds.</p>
      <button class="s1-cta">Launch Investigation →</button>
    </div>
  `,

  // ─── Section 2: Trust Bar — Stacked center ───
  () => `
    <div class="section-frame s2">
      <div class="s2-label">Investigation metrics from the demo dataset</div>
      <div class="s2-metrics">
        <div class="s2-metric">
          <div class="s2-metric-value s2-metric-value--accent">247</div>
          <div class="s2-metric-label">Nodes identified</div>
        </div>
        <div class="s2-divider"></div>
        <div class="s2-metric">
          <div class="s2-metric-value">1,432</div>
          <div class="s2-metric-label">Connections mapped</div>
        </div>
        <div class="s2-divider"></div>
        <div class="s2-metric">
          <div class="s2-metric-value s2-metric-value--critical">12</div>
          <div class="s2-metric-label">Critical risk flagged</div>
        </div>
        <div class="s2-divider"></div>
        <div class="s2-metric">
          <div class="s2-metric-value s2-metric-value--medium">5</div>
          <div class="s2-metric-label">Patterns detected</div>
        </div>
      </div>
    </div>
  `,

  // ─── Section 3: Features — Inverted classic (right caption, left visual) ───
  () => `
    <div class="section-frame s3">
      <div class="s3-visual">
        <div class="s3-visual-bg"></div>
        <div class="s3-graph">
          <svg viewBox="0 0 400 300">
            <line x1="100" y1="80" x2="200" y2="140" stroke="#1c2a3d" stroke-width="2" opacity="0.5"/>
            <line x1="200" y1="140" x2="300" y2="80" stroke="#1c2a3d" stroke-width="1.5" opacity="0.4"/>
            <line x1="200" y1="140" x2="160" y2="230" stroke="#1c2a3d" stroke-width="2.5" opacity="0.6"/>
            <line x1="160" y1="230" x2="280" y2="210" stroke="#ff5673" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
            <line x1="100" y1="80" x2="60" y2="180" stroke="#1c2a3d" stroke-width="1" opacity="0.3"/>
            <line x1="300" y1="80" x2="340" y2="160" stroke="#1c2a3d" stroke-width="1" opacity="0.3"/>
            <line x1="60" y1="180" x2="160" y2="230" stroke="#ffb238" stroke-width="1" opacity="0.35"/>
            <circle cx="200" cy="140" r="22" fill="#1a0a10" stroke="#ff5673" stroke-width="3"/>
            <text x="200" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff5673" font-weight="700">ORCH</text>
            <circle cx="100" cy="80" r="14" fill="#101a29" stroke="#ff5673" stroke-width="2"/>
            <circle cx="300" cy="80" r="12" fill="#101a29" stroke="#ffb238" stroke-width="1.5"/>
            <circle cx="160" cy="230" r="13" fill="#101a29" stroke="#ffb238" stroke-width="1.5"/>
            <circle cx="280" cy="210" r="10" fill="#101a29" stroke="#ffb238" stroke-width="1.5"/>
            <circle cx="60" cy="180" r="8" fill="#101a29" stroke="#35d399" stroke-width="1"/>
            <circle cx="340" cy="160" r="7" fill="#101a29" stroke="#35d399" stroke-width="1"/>
          </svg>
        </div>
      </div>
      <div class="s3-caption">
        <div class="s3-overline">Graph Analysis</div>
        <h2 class="s3-title">Degree centrality surfaces the orchestrator hiding behind normal call volume</h2>
        <p class="s3-desc">Every phone number and account becomes a node. The system scores each by centrality, flags the top influencers, and detects closed loops and laundering chains automatically.</p>
        <a href="#" class="s3-link">See how it works →</a>
      </div>
    </div>
  `,

  // ─── Section 4: Product Showcase — Centered low over full-bleed graph ───
  () => `
    <div class="section-frame s4">
      <div class="s4-bg">
        <svg viewBox="0 0 800 500">
          <!-- Dense network visualization -->
          ${Array.from({length: 20}, (_, i) => {
            const x1 = 50 + Math.sin(i * 1.3) * 300 + 350;
            const y1 = 50 + Math.cos(i * 0.9) * 180 + 200;
            const x2 = 50 + Math.sin((i+3) * 1.1) * 300 + 350;
            const y2 = 50 + Math.cos((i+3) * 0.7) * 180 + 200;
            const opacity = 0.15 + (i % 3) * 0.05;
            const color = i % 5 === 0 ? '#ff5673' : i % 3 === 0 ? '#ffb238' : '#1c2a3d';
            return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${1 + (i%3)*0.5}" opacity="${opacity}"/>`;
          }).join('')}
          ${Array.from({length: 12}, (_, i) => {
            const x = 50 + Math.sin(i * 1.7) * 300 + 350;
            const y = 50 + Math.cos(i * 1.1) * 180 + 200;
            const r = i === 0 ? 20 : 6 + (i % 4) * 3;
            const fill = i === 0 ? '#1a0a10' : '#101a29';
            const stroke = i === 0 ? '#ff5673' : i % 3 === 0 ? '#ffb238' : i % 4 === 0 ? '#35d399' : '#2dd4e0';
            const sw = i === 0 ? 2.5 : 1;
            return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
          }).join('')}
        </svg>
        <div class="s4-gradient"></div>
      </div>
      <div class="s4-content">
        <h2 class="s4-title">From CSV to courtroom-ready report</h2>
        <p class="s4-desc">Upload, analyze, visualize, export. The full investigation pipeline in one tool — with Row-Level Security ensuring no cross-case data leakage.</p>
        <div class="s4-btn-group">
          <button class="s4-btn s4-btn--primary">Try the demo</button>
          <button class="s4-btn s4-btn--ghost">View architecture</button>
        </div>

// ─── Picker wiring ───
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function mount(i) {
  stage.innerHTML = SECTIONS[i]();
}

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= SECTIONS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= SECTIONS.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % SECTIONS.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + SECTIONS.length) % SECTIONS.length);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
