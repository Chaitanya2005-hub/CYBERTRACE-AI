<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Trace AI — Minimalist Surfaces</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=newsreader@400,500;600,700&f[]=jetbrains-mono@400,500&display=swap');

  :root {
    --bg: #FBFBFA;
    --surface: #FFFFFF;
    --border: #EAEAEA;
    --text: #111111;
    --muted: #787774;
    --accent: #111111;
    --pastel-red: #FDEBEC; --pastel-red-text: #9F2F2D;
    --pastel-blue: #E1F3FE; --pastel-blue-text: #1F6C9F;
    --pastel-green: #EDF3EC; --pastel-green-text: #346538;
    --pastel-yellow: #FBF3DB; --pastel-yellow-text: #956400;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Satoshi', 'SF Pro Display', 'Geist Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .serif { font-family: 'Newsreader', 'Lyon Text', 'Playfair Display', serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Geist Mono', monospace; }

  /* ─── Scroll entry animation ─── */
  .reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 600ms cubic-bezier(0.16,1,0.3,1), transform 600ms cubic-bezier(0.16,1,0.3,1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ─── Stage ─── */
  #stage { min-height: 100vh; }

  /* ═══════════════════════════════════════════════════
     SURFACE 1: DOCUMENTATION
     ═══════════════════════════════════════════════════ */
  .docs { max-width: 900px; margin: 0 auto; padding: 80px 24px; }

  .docs-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 64px;
  }
  .docs-logo {
    font-family: 'Satoshi', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .docs-nav-links {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  .docs-nav-links a { color: inherit; text-decoration: none; }
  .docs-nav-links a:hover { color: var(--text); }

  .docs h1 {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .docs-lead {
    font-size: 17px;
    color: var(--muted);
    max-width: 560px;
    line-height: 1.6;
    margin-bottom: 48px;
  }

  .docs-section { margin-bottom: 56px; }
  .docs-section h2 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .docs-section h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
    margin-top: 24px;
  }
  .docs-section p {
    font-size: 15px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 12px;
    max-width: 640px;
  }

  .docs-code {
    background: #F7F6F3;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    overflow-x: auto;
    margin: 16px 0;
  }

  .docs-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-right: 6px;
  }
  .docs-tag--blue { background: var(--pastel-blue); color: var(--pastel-blue-text); }
  .docs-tag--green { background: var(--pastel-green); color: var(--pastel-green-text); }
  .docs-tag--red { background: var(--pastel-red); color: var(--pastel-red-text); }
  .docs-tag--yellow { background: var(--pastel-yellow); color: var(--pastel-yellow-text); }

  .docs-bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 24px 0;
  }
  .docs-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  .docs-card h4 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .docs-card p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0;
  }

  /* ═══════════════════════════════════════════════════
     SURFACE 2: ONBOARDING
     ═══════════════════════════════════════════════════ */
  .onboard { max-width: 600px; margin: 0 auto; padding: 80px 24px; text-align: center; }

  .onboard-step {
    display: none;
  }
  .onboard-step.active { display: block; }

  .onboard-progress {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 48px;
  }
  .onboard-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 200ms ease-out;
  }
  .onboard-dot.active { background: var(--text); }

  .onboard-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .onboard h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .onboard p {
    font-size: 15px;
    color: var(--muted);
    max-width: 440px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }

  .onboard-visual {
    width: 100%;
    aspect-ratio: 16/10;
    background: #F7F6F3;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .onboard-btn {
    display: inline-block;
    padding: 12px 32px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'Satoshi', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 150ms ease-out;
  }
  .onboard-btn:active { background: #333333; }
  .onboard-btn--ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    margin-left: 8px;
  }
  .onboard-btn--ghost:hover { color: var(--text); border-color: #ccc; }

  /* ═══════════════════════════════════════════════════
     SURFACE 3: LANDING PAGE
     ═══════════════════════════════════════════════════ */
  .landing { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  .landing-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 80px;
  }
  .landing-logo { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .landing-nav-links { display: flex; gap: 28px; font-size: 13px; color: var(--muted); }
  .landing-nav-links a { color: inherit; text-decoration: none; }
  .landing-nav-links a:hover { color: var(--text); }
  .landing-nav-cta {
    padding: 8px 20px;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .landing-hero {
    text-align: center;
    padding: 60px 0 80px;
    position: relative;
  }
  .landing-hero::before {
    content: '';
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(253,235,236,0.4) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .landing-hero > * { position: relative; z-index: 1; }

  .landing-hero .serif {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 16px;
  }

  .landing-hero-sub {
    font-size: 17px;
    color: var(--muted);
    max-width: 480px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }

  .landing-bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 0 0 64px;
  }
  .landing-bento-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    transition: box-shadow 200ms ease-out;
  }
  .landing-bento-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .landing-bento-card.wide { grid-column: span 2; }

  .landing-bento-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 18px;
  }

  .landing-bento-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .landing-bento-card p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .landing-quote {
    text-align: center;
    padding: 64px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 64px;
  }
  .landing-quote blockquote {
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.4;
    max-width: 600px;
    margin: 0 auto 16px;
  }
  .landing-quote cite {
    font-size: 13px;
    color: var(--muted);
    font-style: normal;
  }

  .landing-cta-section {
    text-align: center;
    padding: 80px 0;
  }
  .landing-cta-section h2 {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .landing-cta-section p {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .landing-footer {
    text-align: center;
    padding: 32px 0;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  /* ═══════════════════════════════════════════════════
     SURFACE 4: DASHBOARD (light adaptation)
     ═══════════════════════════════════════════════════ */
  .dash { display: flex; min-height: 100vh; }

  .dash-sidebar {
    width: 240px;
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .dash-sidebar-logo {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .dash-nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: background 150ms ease-out;
    margin-bottom: 2px;
  }
  .dash-nav-item:hover { background: #F7F6F3; }
  .dash-nav-item.active { background: #F7F6F3; color: var(--text); font-weight: 500; }

  .dash-main { flex: 1; padding: 24px 32px; overflow-y: auto; }

  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .dash-header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .dash-header-actions { display: flex; gap: 8px; }

  .dash-btn {
    padding: 8px 16px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 150ms ease-out;
  }
  .dash-btn:hover { background: #F7F6F3; }
  .dash-btn--primary { background: var(--accent); color: #FFF; border-color: var(--accent); }
  .dash-btn--primary:hover { background: #333; }

  .dash-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .dash-metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .dash-metric-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .dash-metric-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .dash-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .dash-table-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .dash-table-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    align-items: center;
  }
  .dash-table-row:last-child { border-bottom: none; }
  .dash-table-row:hover { background: #FAFAF9; }
  .dash-id { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .dash-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .dash-badge--red { background: var(--pastel-red); color: var(--pastel-red-text); }
  .dash-badge--yellow { background: var(--pastel-yellow); color: var(--pastel-yellow-text); }
  .dash-badge--green { background: var(--pastel-green); color: var(--pastel-green-text); }


  /* ═══════════════════════════════════════════════════
     PICKER — Verbatim from PICKER.md
     ═══════════════════════════════════════════════════ */
  .proto-picker {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
    border-radius: 999px; background: rgba(17,17,17,0.88);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.2);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1; user-select: none;
  }
  .proto-picker-highlight {
    position: absolute; top: 4px; left: 0; height: 28px;
    border-radius: 999px; background: rgba(255,255,255,0.12); will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1);
  }
  .proto-picker-item {
    position: relative; display: flex; align-items: center; height: 28px;
    padding: 0 10px; border: 0; border-radius: 999px; background: transparent;
    color: rgba(255,255,255,0.5); font: inherit; cursor: pointer;
    transition: color 150ms ease-out; white-space: nowrap;
  }
  .proto-picker-item:hover { color: rgba(255,255,255,0.8); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item[data-active] { color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Docs</button>
  <button class="proto-picker-item">Onboarding</button>
  <button class="proto-picker-item">Landing</button>
  <button class="proto-picker-item">Dashboard</button>
</nav>

<script>
const SURFACES = [
  // ─── Surface 1: Documentation ───
  () => `
    <div class="docs">
      <nav class="docs-nav">
        <div class="docs-logo">Cyber Trace AI</div>
        <div class="docs-nav-links">
          <a href="#">Guide</a>
          <a href="#">API</a>
          <a href="#">Schema</a>
        </div>
      </nav>

      <h1 class="serif reveal">Getting Started</h1>
      <p class="docs-lead reveal">Upload a CDR or financial transaction CSV. The system builds an interactive link-graph, scores each node by centrality, and flags suspicious patterns automatically.</p>

      <div class="docs-section reveal">
        <h2>Quick Start</h2>
        <p>Connect your Supabase project, configure environment variables, and launch the dev server. The full pipeline — upload to graph — works in under 5 seconds on a 10,000-row dataset.</p>

        <div class="docs-code"><span style="color:#787774"># 1. Install dependencies</span>
cd client && npm install
cd server && npm install

<span style="color:#787774"># 2. Configure environment</span>
cp .env.example .env

<span style="color:#787774"># 3. Start the servers</span>
cd server && npm run dev
cd client && npm run dev</div>

        <p>Or click <strong>Pre-load Sample Cyber Network</strong> in the header for an instant demo with no setup required.</p>
      </div>

      <div class="docs-section reveal">
        <h2>Architecture</h2>
        <div class="docs-bento">
          <div class="docs-card">
            <h4>Frontend</h4>
            <p>React (Vite) + Cytoscape.js graph canvas + Tailwind CSS v4 with custom theme tokens.</p>
          </div>
          <div class="docs-card">
            <h4>Backend</h4>
            <p>Node.js + Express. Streaming CSV parse via multer + csv-parser. No full-buffer loading.</p>
          </div>
          <div class="docs-card">
            <h4>Database</h4>
            <p>Supabase (PostgreSQL) with Row-Level Security. Every case scoped to its owning investigator.</p>
          </div>
          <div class="docs-card">
            <h4>Analysis</h4>
            <p>Degree centrality, orchestrator flagging, call loop detection, laundering ring tracing.</p>
          </div>
        </div>
      </div>

      <div class="docs-section reveal">
        <h2>Data Schema</h2>
        <p>CDR records require six fields. The column auto-detection handles most common export formats from Indian telecom providers.</p>

        <div class="docs-code"><span style="color:#787774">-- CDR Log Schema</span>
caller_number  TEXT NOT NULL
receiver_number TEXT NOT NULL
timestamp      TIMESTAMPTZ NOT NULL
duration_sec   INTEGER NOT NULL
tower_id       TEXT
call_type      TEXT NOT NULL  <span style="color:#787774">-- voice | sms | data</span></div>

        <div style="margin-top: 16px;">
          <span class="docs-tag docs-tag--blue">CDR</span>
          <span class="docs-tag docs-tag--green">Financial</span>
          <span class="docs-tag docs-tag--yellow">Verified</span>
        </div>
      </div>

      <div class="docs-section reveal">
        <h2>Pattern Detection</h2>
        <h3>Call Loops</h3>
        <p>Closed cycles of 3–6 numbers calling each other repeatedly. Detected via depth-first search bounded to small cycles.</p>
        <h3>Laundering Rings</h3>
        <p>Multi-hop financial transfers with amount decay (10%+ per hop) within a 24-hour window. Chain-following algorithm traces the full path.</p>
        <h3>Frequency Spikes</h3>
        <p>Statistical outlier analysis — nodes with abnormally high unique contact count (>2 standard deviations above mean) in a short window.</p>
      </div>
    </div>
  `,

  // ─── Surface 2: Onboarding ───
  () => `
    <div class="onboard" id="onboard-root">
      <div class="onboard-progress">
        <div class="onboard-dot active" data-step="0"></div>
        <div class="onboard-dot" data-step="1"></div>
        <div class="onboard-dot" data-step="2"></div>
        <div class="onboard-dot" data-step="3"></div>
      </div>

      <div class="onboard-step active" data-step="0">
        <div class="onboard-num">STEP 1 OF 4</div>
        <h1 class="serif">Welcome to<br>Cyber Trace AI</h1>
        <p>An AI-assisted investigation tool that turns raw call records and bank transaction logs into a traceable criminal network.</p>
        <div class="onboard-visual" style="background: linear-gradient(135deg, #F7F6F3 0%, #FBFBFA 100%);">
          <svg width="120" height="80" viewBox="0 0 120 80" fill="none">
            <circle cx="30" cy="40" r="8" stroke="#111" stroke-width="1.5" fill="none"/>
            <circle cx="90" cy="25" r="6" stroke="#111" stroke-width="1.5" fill="none"/>
            <circle cx="90" cy="55" r="6" stroke="#111" stroke-width="1.5" fill="none"/>
            <circle cx="60" cy="40" r="10" stroke="#9F2F2D" stroke-width="2" fill="#FDEBEC"/>
            <line x1="38" y1="40" x2="50" y2="40" stroke="#EAEAEA" stroke-width="1.5"/>
            <line x1="70" y1="40" x2="84" y2="25" stroke="#EAEAEA" stroke-width="1.5"/>
            <line x1="70" y1="40" x2="84" y2="55" stroke="#EAEAEA" stroke-width="1.5"/>
          </svg>
        </div>
        <button class="onboard-btn" onclick="nextStep()">Get started</button>
      </div>

      <div class="onboard-step" data-step="1">
        <div class="onboard-num">STEP 2 OF 4</div>
        <h1 class="serif">Upload your data</h1>
        <p>Drop a CDR or financial transaction CSV. The system auto-detects columns and maps them to the analysis schema — no pre-formatting needed.</p>

// ─── Onboarding state ───
let onboardStep = 0;
function updateOnboard() {
  document.querySelectorAll('.onboard-step').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.step) === onboardStep);
  });
  document.querySelectorAll('.onboard-dot').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.step) <= onboardStep);
  });
}
function nextStep() { if (onboardStep < 3) { onboardStep++; updateOnboard(); } }
function prevStep() { if (onboardStep > 0) { onboardStep--; updateOnboard(); } }

// ─── Picker wiring ───
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function mount(i) {
  stage.innerHTML = SURFACES[i]();
  // Init scroll reveal
  requestAnimationFrame(() => {
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  });
}

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= SURFACES.length) return;
  current = i;
  onboardStep = 0;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= SURFACES.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % SURFACES.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + SURFACES.length) % SURFACES.length);
});

// Scroll reveal observer
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
