<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Trace AI — Mobile Concept</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=space-grotesk@500,600,700&f[]=jetbrains-mono@400,500,600&display=swap');

  :root {
    --base: #05080d;
    --panel: #0c131e;
    --panel-alt: #101a29;
    --border: #1c2a3d;
    --text: #dce6f2;
    --muted: #7d90a8;
    --accent: #2dd4e0;
    --accent-dim: #1a8b93;
    --critical: #ff5673;
    --medium: #ffb238;
    --low: #35d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Satoshi', sans-serif;
    background: #020408;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Page header ─── */
  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .page-header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* ─── Phone mockup ─── */
  .phone {
    width: 320px;
    height: 640px;
    border-radius: 36px;
    border: 2.5px solid #1a1f2e;
    background: var(--base);
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 20px 60px rgba(0,0,0,0.5),
      0 4px 16px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 28px;
    background: #0a0e16;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .phone-status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--text);
    z-index: 5;
  }

  .phone-home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    z-index: 10;
  }

  .phone-screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .phone-screen::-webkit-scrollbar { display: none; }

  /* ─── Screen layouts ─── */
  .screen { padding: 52px 16px 32px; min-height: 100%; }

  /* Screen 1: Case Dashboard */
  .case-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .case-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent-dim);
    background: rgba(45,212,224,0.08);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(45,212,224,0.15);
  }
  .case-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .case-subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* Metric cards */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .metric-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .metric-label {
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .metric-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .metric-value--accent { color: var(--accent); }
  .metric-value--critical { color: var(--critical); }
  .metric-value--medium { color: var(--medium); }

  /* Alert list */
  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  .alert-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .alert-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .alert-dot--critical { background: var(--critical); }
  .alert-dot--medium { background: var(--medium); }
  .alert-dot--low { background: var(--low); }
  .alert-content { flex: 1; }
  .alert-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .alert-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .alert-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: 8px;
    z-index: 5;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 9px;
    color: var(--muted);
    text-decoration: none;
  }
  .nav-item--active { color: var(--accent); }
  .nav-icon { width: 20px; height: 20px; }

  /* Screen 2: Network Graph (mobile) */
  .graph-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .graph-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
  }
  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
  }
  .filter-chip--active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(45,212,224,0.06);
  }

  .graph-canvas {
    width: 100%;
    height: 280px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }

  /* SVG graph nodes */
  .graph-canvas svg { width: 100%; height: 100%; }

  .node-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .node-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .node-avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .node-avatar--critical { background: rgba(255,86,115,0.12); color: var(--critical); border: 1px solid rgba(255,86,115,0.25); }
  .node-avatar--medium { background: rgba(255,178,56,0.12); color: var(--medium); border: 1px solid rgba(255,178,56,0.25); }
  .node-avatar--low { background: rgba(53,211,153,0.12); color: var(--low); border: 1px solid rgba(53,211,153,0.25); }
  .node-info { flex: 1; min-width: 0; }
  .node-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-meta {
    font-size: 10px;
    color: var(--muted);
  }
  .node-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .node-badge--critical { background: rgba(255,86,115,0.12); color: var(--critical); border: 1px solid rgba(255,86,115,0.2); }
  .node-badge--medium { background: rgba(255,178,56,0.12); color: var(--medium); border: 1px solid rgba(255,178,56,0.2); }
  .node-badge--orchestrator { background: rgba(255,86,115,0.15); color: var(--critical); border: 1px solid rgba(255,86,115,0.3); }

  /* Screen 3: Node Detail */
  .detail-hero {
    text-align: center;
    padding: 16px 0 20px;
  }
  .detail-avatar {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(255,86,115,0.1);
    border: 2px solid var(--critical);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--critical);
  }
  .detail-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .detail-type {
    font-size: 11px;
    color: var(--muted);
  }

  .detail-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .detail-stat {
    text-align: center;
    padding: 10px 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .detail-stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }
  .detail-stat-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .detail-section { margin-bottom: 16px; }
  .detail-section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .connection-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .connection-arrow {
    color: var(--accent);
    font-size: 12px;
    flex-shrink: 0;
  }
  .connection-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text);
    flex: 1;
  }
  .connection-freq {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
  }

  /* Screen 4: Report Export */
  .report-preview {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .report-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .report-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .report-row:last-child { border-bottom: none; }
  .report-label { color: var(--muted); }
  .report-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
  }

  .export-btn {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
    transition: opacity 150ms ease-out;
  }
  .export-btn:active { opacity: 0.8; }
  .export-btn--primary {
    background: var(--accent);
    color: var(--base);
  }
  .export-btn--secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* ─── Picker (verbatim from PICKER.md) ─── */
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24), 0 2px 6px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255,255,255,0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,0.12); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>

<script>

  // ─── Screen 2: Network Graph ───

// ─── Picker wiring ───
const container = document.getElementById('phone-container');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function renderPhone(screenIndex) {
  container.innerHTML = `
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-status-bar">
        <span>9:41</span>
        <span style="display:flex;gap:4px;align-items:center;">
          <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2.5" height="4" rx="0.5"/><rect x="3.5" y="4" width="2.5" height="6" rx="0.5"/><rect x="7" y="2" width="2.5" height="8" rx="0.5"/><rect x="10.5" y="0" width="2.5" height="10" rx="0.5"/></svg>
          <svg width="16" height="10" viewBox="0 0 16 10" fill="currentColor"><rect x="0.5" y="0.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="14" y="3" width="1.5" height="4" rx="0.5"/><rect x="2" y="2" width="9" height="6" rx="1"/></svg>
        </span>
      </div>
      <div class="phone-screen">${SCREENS[screenIndex]()}</div>
      <div class="phone-home-indicator"></div>
    </div>
  `;
}

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function setActive(i) {
  if (i < 0 || i >= SCREENS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  renderPhone(i);
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= SCREENS.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % SCREENS.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + SCREENS.length) % SCREENS.length);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
